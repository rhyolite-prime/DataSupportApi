# MagmaNet — FreeRADIUS 3 SQL module.
# Install as /etc/freeradius/3.0/mods-available/sql and symlink into mods-enabled/.
#
# The MagmaNet tables live in the `radius` schema of the same database used by
# DataSupportApi, so one backup covers both the control plane and AAA state.

sql {
    driver = "rlm_sql_postgresql"
    dialect = "postgresql"

    server = "127.0.0.1"
    port = 5432
    login = "radius"
    password = "CHANGE_ME"

    radius_db = "DataSupportDb"

    # rlm_sql_postgresql runs every query on the connection below; this keeps
    # unqualified table names resolving to the `radius` schema.
    connect_query = "SET search_path TO radius, public;"

    # NAS clients come from radius.nas; MagmaDeviceService keeps it in sync.
    read_clients = yes
    client_table = "nas"

    # Nas-IP-Address is stored as text/inet by FreeRADIUS.
    delete_stale_sessions = yes

    # Log accounting packets only when radacct grew unexpectedly.
    # logfile = ${logdir}/sqllog.conf
    # accounting { ... } is inherited from the default sql config.

    group_attribute = "SQL-Group"
    readonly = no

    post-auth {
        # Keep radpostauth lean; the API only needs failures for fraud checks.
        query = "${..postauth_query}"
    }

    $INCLUDE ${modconfdir}/${.:name}/main/${dialect}/queries.conf
}
