# MagmaNet — additions to /etc/freeradius/3.0/sites-available/default.
#
# Hotspot logins are MAC-authenticated with the password MagmaNet writes into
# radcheck (Cleartext-Password := the per-subscription secret). Interim
# accounting every 60 s feeds magma_sessions; Session-Timeout and
# Mikrotik-Total-Limit are recomputed on every Access-Accept.

authorize {
    preprocess
    # Reject blocked devices and disabled subscribers before touching SQL.
    sql
    expiration
    # MagmaNet stores the plan allowance in radreply; no dailycounter needed.
    pap
}

authenticate {
    Auth-Type PAP {
        pap
    }
}

preacct {
    preprocess
    acct_unique
}

accounting {
    detail
    sql
    # Uncomment when you also want radacct replicated to a second host.
    # replicated
}

post-auth {
    sql
    Post-Auth-Type REJECT {
        sql
    }
}

session {
    radutmp
}

# CoA / Disconnect (RFC 5176) — the API sends these to gateways on UDP 3799.
# Gateways listen because MagmaDeviceService sets `/radius incoming accept=yes`.
#
# Run with: freeradius -X  to confirm `rlm_sql` loaded and nas rows are read.
