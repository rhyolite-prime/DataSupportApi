# MagmaNet — WireGuard server on the VPS (FreeRADIUS + DataSupportApi host).
# Install as /etc/wireguard/wg0.conf with mode 0600.
#
# Consumer MTN/Telecel fibre is usually CGNAT, so every gateway dials OUT to
# this endpoint. CoA then travels inside the tunnel and never needs a public
# IP at the hotspot.

[Interface]
Address = 10.200.0.1/24
ListenPort = 51820
PrivateKey = SERVER_PRIVATE_KEY
# NAT for router management traffic that must leave the VPS.
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# Zone KANESHIE — gateway RB5009 (10.200.1.10)
PublicKey = GATEWAY_KANESHIE_PUBLIC_KEY
PresharedKey = OPTIONAL_PSK
AllowedIPs = 10.200.1.10/32

# Add one [Peer] block per gateway. Keep the last octet in radius.nas /
# magma_devices.tunnel_ip consistent with AllowedIPs.
